<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Helvetica,Arial,sans-serif;color:#1a1d21;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e6e8eb;">
        <tr><td style="padding:28px 36px 0 36px;">
          <img src="{{brand.logo_url}}" alt="" height="28" style="height:28px;display:block;border:0;">
        </td></tr>
        <tr><td style="padding:24px 36px 8px 36px;font-size:15px;line-height:1.65;color:#1a1d21;">
          {{content}}
        </td></tr>
        <tr><td style="padding:24px 36px 32px 36px;border-top:1px solid #eef0f2;">
          <p style="margin:0;font-size:12px;line-height:1.6;color:#8a9099;">{{brand.footer}}</p>
          <p style="margin:10px 0 0 0;font-size:11px;color:#b0b6bd;">Sent via OUTLNK</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
